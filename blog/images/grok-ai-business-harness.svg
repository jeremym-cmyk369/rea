  <g transform="skewX(-15)"><rect x="0" y="0" width="5" height="20" fill="#e8eef8"/><rect x="9" y="4" width="5" height="16" fill="#e8eef8" opacity=".7"/><rect x="18" y="8" width="5" height="12" fill="#e8eef8" opacity=".45"/></g>
