<text x="100" y="118" font-size="40" font-weight="600" letter-spacing="-1.5" fill="#e8eef8">Grok Bot covers part.</text><text x="100" y="166" font-size="40" font-weight="600" letter-spacing="-1.5" fill="#acc8ff">The harness covers the rest.</text><text x="100" y="232" font-size="11" font-weight="700" letter-spacing="2.6" fill="#8fa0b8">WHAT GROK BOT SUPPLIES</text><text x="640" y="232" font-size="11" font-weight="700" letter-spacing="2.6" fill="#acc8ff">WHAT THE HARNESS STILL ADDS</text><rect x="100" y="252" width="460" height="76" rx="6" fill="#141c29" stroke="#5c718d" stroke-opacity=".8"/><text x="124" y="285" font-size="12" font-weight="700" letter-spacing="2.2" fill="#e8eef8">CLOUD COMPUTER + APP SIGN-IN</text><text x="124" y="308" font-size="13" letter-spacing=".4" fill="#8fa0b8">Bots work across your tools</text><rect x="100" y="344" width="460" height="76" rx="6" fill="#141c29" stroke="#5c718d" stroke-opacity=".8"/><text x="124" y="377" font-size="12" font-weight="700" letter-spacing="2.2" fill="#e8eef8">MODEL-BASED AUTO-REVIEW</text><text x="124" y="400" font-size="13" letter-spacing=".4" fill="#8fa0b8">A model screens risky actions</text><rect x="100" y="436" width="460" height="76" rx="6" fill="#141c29" stroke="#5c718d" stroke-opacity=".8"/><text x="124" y="469" font-size="12" font-weight="700" letter-spacing="2.2" fill="#e8eef8">ENTERPRISE-ONLY CONTROLS</text><text x="124" y="492" font-size="13" letter-spacing=".4" fill="#8fa0b8">Network rules · audit · recording</text><rect x="640" y="252" width="460" height="46" rx="6" fill="#1d2b42" stroke="#6f8fc6" stroke-opacity=".9"/><g transform="translate(664 275)"><path d="M-5.6000000000000005 0 l4.0 4.0 l8.0 -8.8" fill="none" stroke="#acc8ff" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"/></g><text x="690" y="280" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e8eef8">SCOPED PERMISSIONS</text><text x="1084" y="280" text-anchor="end" font-size="11.5" letter-spacing=".3" fill="#8fa0b8">Minimum access per workflow</text><rect x="640" y="308" width="460" height="46" rx="6" fill="#1d2b42" stroke="#6f8fc6" stroke-opacity=".9"/><g transform="translate(664 331)"><path d="M-5.6000000000000005 0 l4.0 4.0 l8.0 -8.8" fill="none" stroke="#acc8ff" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"/></g><text x="690" y="336" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e8eef8">EXACT-ACTION APPROVAL</text><text x="1084" y="336" text-anchor="end" font-size="11.5" letter-spacing=".3" fill="#8fa0b8">A person signs off</text><rect x="640" y="364" width="460" height="46" rx="6" fill="#1d2b42" stroke="#6f8fc6" stroke-opacity=".9"/><g transform="translate(664 387)"><path d="M-5.6000000000000005 0 l4.0 4.0 l8.0 -8.8" fill="none" stroke="#acc8ff" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"/></g><text x="690" y="392" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e8eef8">VERIFY + RECONCILE</text><text x="1084" y="392" text-anchor="end" font-size="11.5" letter-spacing=".3" fill="#8fa0b8">Confirm results, never assume</text><rect x="640" y="420" width="460" height="46" rx="6" fill="#1d2b42" stroke="#6f8fc6" stroke-opacity=".9"/><g transform="translate(664 443)"><path d="M-5.6000000000000005 0 l4.0 4.0 l8.0 -8.8" fill="none" stroke="#acc8ff" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"/></g><text x="690" y="448" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e8eef8">DUPLICATE PROTECTION</text><text x="1084" y="448" text-anchor="end" font-size="11.5" letter-spacing=".3" fill="#8fa0b8">One send, one booking</text><rect x="640" y="476" width="460" height="46" rx="6" fill="#1d2b42" stroke="#6f8fc6" stroke-opacity=".9"/><g transform="translate(664 499)"><path d="M-5.6000000000000005 0 l4.0 4.0 l8.0 -8.8" fill="none" stroke="#acc8ff" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"/></g><text x="690" y="504" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e8eef8">BUSINESS RECORD</text><text x="1084" y="504" text-anchor="end" font-size="11.5" letter-spacing=".3" fill="#8fa0b8">Who approved what, and why</text><line x1="560" y1="380" x2="640" y2="380" stroke="#6f8fc6" stroke-opacity="0.9" stroke-width="1.4" stroke-dasharray="4 6"/>
