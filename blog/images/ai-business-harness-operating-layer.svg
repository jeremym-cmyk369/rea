<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">AI business harness: the operational layer between models and business systems</title>
<desc id="desc">An AI model supplies reasoning on the left. A central AI business harness controls tools, workflows, access permissions, human approvals, verification, audit records and costs. Approved actions reach email, CRM, files and databases on the right.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08101b"/><stop offset="1" stop-color="#172a42"/></linearGradient>
<linearGradient id="center" x2="1" y2="1"><stop stop-color="#254b74"/><stop offset="1" stop-color="#152b47"/></linearGradient>
<linearGradient id="accent" x2="1"><stop stop-color="#79d8fa"/><stop offset="1" stop-color="#adbbff"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="640" cy="310" r="290" fill="#4d92cc" opacity=".08" filter="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="57" fill="#bad1e5" font-size="16" font-weight="700" letter-spacing="3">AI BUSINESS HARNESS  /  EXPLAINED</text>
<text x="60" y="118" fill="#fff" font-size="38" font-weight="700">From reasoning to reliable action.</text>
<text x="60" y="152" fill="#b4c7d9" font-size="17">A harness connects intelligence to approved work, with controls between.</text>
