<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">The shared execution rule: four checks before an external action</title>
<desc id="desc">Before any external action such as sending an email or booking an appointment, the harness rechecks authorization and eligibility, matches approval to the exact action, applies duplicate protection, and reconciles uncertain outcomes before retrying.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08101b"/><stop offset="1" stop-color="#172a42"/></linearGradient>
<linearGradient id="accent" x2="1"><stop stop-color="#79d8fa"/><stop offset="1" stop-color="#adbbff"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="57" fill="#bad1e5" font-size="16" font-weight="700" letter-spacing="3">THE SHARED EXECUTION RULE</text>
<text x="60" y="112" fill="#fff" font-size="36" font-weight="700">Four checks before anything leaves the building.</text>
<g>
<rect x="60" y="175" width="520" height="160" rx="14" fill="#0f1a29" stroke="#2c3f57"/>
<circle cx="112" cy="227" r="26" fill="none" stroke="url(#accent)" stroke-width="2"/><text x="112" y="234" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text>
<text x="160" y="222" fill="#fff" font-size="22" font-weight="700">Recheck authorization</text>
<text x="160" y="250" fill="#b4c7d9" font-size="17">Is this workflow still allowed to act,</text>
<text x="160" y="274" fill="#b4c7d9" font-size="17">and is the item still eligible?</text>
<rect x="620" y="175" width="520" height="160" rx="14" fill="#0f1a29" stroke="#2c3f57"/>
<circle cx="672" cy="227" r="26" fill="none" stroke="url(#accent)" stroke-width="2"/><text x="672" y="234" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text>
<text x="720" y="222" fill="#fff" font-size="22" font-weight="700">Match the exact approval</text>
<text x="720" y="250" fill="#b4c7d9" font-size="17">Recipient, content, amount or timing</text>
<text x="720" y="274" fill="#b4c7d9" font-size="17">changed? Approve again.</text>
<rect x="60" y="365" width="520" height="160" rx="14" fill="#0f1a29" stroke="#2c3f57"/>
<circle cx="112" cy="417" r="26" fill="none" stroke="url(#accent)" stroke-width="2"/><text x="112" y="424" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">3</text>
<text x="160" y="412" fill="#fff" font-size="22" font-weight="700">Apply duplicate protection</text>
<text x="160" y="440" fill="#b4c7d9" font-size="17">The same message, booking or update</text>
<text x="160" y="464" fill="#b4c7d9" font-size="17">is not executed twice.</text>
<rect x="620" y="365" width="520" height="160" rx="14" fill="#0f1a29" stroke="#2c3f57"/>
<circle cx="672" cy="417" r="26" fill="none" stroke="url(#accent)" stroke-width="2"/><text x="672" y="424" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">4</text>
<text x="720" y="412" fill="#fff" font-size="22" font-weight="700">Reconcile uncertain outcomes</text>
<text x="720" y="440" fill="#b4c7d9" font-size="17">A timeout is not a success. Verify</text>
<text x="720" y="464" fill="#b4c7d9" font-size="17">the external system before retrying.</text>
</g>
<text x="60" y="580" fill="#7f95ad" font-size="15">Applies to emails, bookings, report submissions, lead creation, record updates, orders and showings.</text>
</g>
</svg>
