<text x="600" y="92" text-anchor="middle" font-size="40" font-weight="600" letter-spacing="-1.5" fill="#e8eef8">Three things called <tspan fill="#acc8ff">"harness"</tspan></text><rect x="90" y="150" width="300" height="330" rx="10" fill="#141c29" stroke="#5c718d" stroke-opacity=".85"/><text x="118" y="196" font-size="11" font-weight="700" letter-spacing="2.6" fill="#8fa0b8">01</text><text x="118" y="232" font-size="15" font-weight="700" letter-spacing="2.2" fill="#e8eef8">DEVELOPER PLATFORMS</text><text x="118" y="272" font-size="17" fill="#b8c6da">Foundations engineers use</text><text x="118" y="298" font-size="17" fill="#b8c6da">to build their own agents</text><rect x="118" y="380" width="26" height="26" rx="4" fill="none" stroke="#5c718d"/><rect x="152" y="380" width="26" height="26" rx="4" fill="none" stroke="#5c718d"/><rect x="186" y="380" width="26" height="26" rx="4" fill="none" stroke="#5c718d"/><rect x="220" y="380" width="26" height="26" rx="4" fill="none" stroke="#5c718d"/><text x="280" y="399" font-size="15" fill="#8fa0b8">&lt;/&gt;</text><text x="118" y="452" font-size="11" font-weight="700" letter-spacing="2.4" fill="#5c718d">FOR ENGINEERS</text><rect x="440" y="150" width="300" height="330" rx="10" fill="#141c29" stroke="#5c718d" stroke-opacity=".85"/><text x="468" y="196" font-size="11" font-weight="700" letter-spacing="2.6" fill="#8fa0b8">02</text><text x="468" y="232" font-size="15" font-weight="700" letter-spacing="2.2" fill="#e8eef8">SOFTWARE DELIVERY</text><text x="468" y="272" font-size="17" fill="#b8c6da">Same word, different job:</text><text x="468" y="298" font-size="17" fill="#b8c6da">testing and shipping code</text><path d="M468 393 h170" stroke="#5c718d" stroke-width="1.6"/><circle cx="480" cy="393" r="8" fill="#1a2536" stroke="#5c718d"/><circle cx="530" cy="393" r="8" fill="#1a2536" stroke="#5c718d"/><circle cx="580" cy="393" r="8" fill="#1a2536" stroke="#5c718d"/><circle cx="630" cy="393" r="8" fill="#1a2536" stroke="#5c718d"/><text x="468" y="452" font-size="11" font-weight="700" letter-spacing="2.4" fill="#5c718d">FOR DEV TEAMS</text><rect x="776" y="136" width="328" height="358" rx="14" fill="#acc8ff" opacity=".12" filter="url(#soft)"/><rect x="790" y="150" width="300" height="330" rx="10" fill="#1d2b42" stroke="#acc8ff" stroke-opacity=".85"/><text x="818" y="196" font-size="11" font-weight="700" letter-spacing="2.6" fill="#acc8ff">03</text><text x="818" y="232" font-size="15" font-weight="700" letter-spacing="2.2" fill="#e8eef8">OPERATIONS HARNESS</text><text x="818" y="272" font-size="17" fill="#dbe6f7">Built around your own</text><text x="818" y="298" font-size="17" fill="#dbe6f7">workflows and tools</text><g transform="translate(861.5 393)"><rect x="-43.5" y="-20" width="87" height="40" rx="5" fill="#141c29" stroke="#5c718d" stroke-opacity=".8"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.4" fill="#cfdcee">INQUIRY</text></g><g transform="translate(947.5 393)"><rect x="-34.5" y="-20" width="69" height="40" rx="5" fill="#141c29" stroke="#5c718d" stroke-opacity=".8"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.4" fill="#cfdcee">DRAFT</text></g><g transform="translate(1033.5 393)"><rect x="-43.5" y="-20" width="87" height="40" rx="5" fill="#1d2b42" stroke="#6f8fc6" stroke-opacity=".8"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.4" fill="#e8eef8">APPROVE</text></g><text x="818" y="452" font-size="11" font-weight="700" letter-spacing="2.4" fill="#acc8ff">FOR YOUR BUSINESS</text><g transform="translate(1052 196)"><circle r="16" fill="#1d2b42" stroke="#acc8ff"/><path d="M-4.8999999999999995 0 l3.5 3.5 l7.0 -7.699999999999999" fill="none" stroke="#acc8ff" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round"/></g>
